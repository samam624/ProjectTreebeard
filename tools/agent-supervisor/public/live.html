<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude + Codex Live</title>
<style>
  :root {
    --bg: #0e141b;
    --panel: #17212b;
    --line: #26333f;
    --text: #f5f7fa;
    --dim: #8493a3;
    --claude: #d97757;
    --codex: #3987e5;
    --err: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  #status { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .col:last-child { border-right: none; }
  .col-head {
    padding: 8px 14px; font-weight: 700; font-size: 12px; letter-spacing: .04em;
    text-transform: uppercase; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .col-head.claude { color: var(--claude); }
  .col-head.codex { color: var(--codex); }
  .transcript { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg { margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.tool { color: var(--dim); font-family: ui-monospace, monospace; font-size: 12.5px; }
  .msg.error { color: var(--err); }
  .msg.thinking { opacity: .55; }
  .round-marker {
    grid-column: 1 / -1; margin: 4px 14px; padding: 8px 12px; background: var(--panel);
    border-radius: 6px; font-size: 13px; color: var(--text);
  }
  .round-header { grid-column: 1 / -1; }
  footer {
    border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 8px; flex-shrink: 0;
  }
  #promptBox {
    flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); padding: 10px 12px; font: inherit; resize: none; height: 44px;
  }
  #sendBtn {
    background: var(--codex); color: white; border: none; border-radius: 6px;
    padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #sendBtn:disabled { opacity: .5; cursor: default; }
  #cost { color: var(--dim); font-size: 12px; padding: 0 14px 6px; }
</style>
</head>
<body>
<header>
  <h1>Claude + Codex &mdash; live</h1>
  <span id="status">connecting&hellip;</span>
</header>
<div id="roundLog" style="padding: 0 14px;"></div>
<main>
  <div class="col">
    <div class="col-head claude">Claude</div>
    <div class="transcript" id="claudeLog"></div>
  </div>
  <div class="col">
    <div class="col-head codex">Codex</div>
    <div class="transcript" id="codexLog"></div>
  </div>
</main>
<div id="cost"></div>
<footer>
  <textarea id="promptBox" placeholder="Ask both agents something&hellip; (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="sendBtn">Send</button>
</footer>
<script>
  const claudeLog = document.getElementById("claudeLog");
  const codexLog = document.getElementById("codexLog");
  const roundLog = document.getElementById("roundLog");
  const statusEl = document.getElementById("status");
  const costEl = document.getElementById("cost");
  const promptBox = document.getElementById("promptBox");
  const sendBtn = document.getElementById("sendBtn");

  const activeBubble = { claude: null, codex: null };

  function logFor(agent) { return agent === "claude" ? claudeLog : codexLog; }

  function appendMsg(agent, cls, text) {
    const log = logFor(agent);
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function handleEvent(ev) {
    if (ev.agent === "system") {
      if (ev.kind === "round_start") {
        const marker = document.createElement("div");
        marker.className = "round-marker";
        marker.textContent = "You: " + ev.prompt;
        roundLog.appendChild(marker);
        activeBubble.claude = null;
        activeBubble.codex = null;
        sendBtn.disabled = true;
      } else if (ev.kind === "round_end") {
        sendBtn.disabled = false;
        if (typeof ev.claudeCostUsd === "number") {
          costEl.textContent = "Claude session cost so far: $" + ev.claudeCostUsd.toFixed(4) + " (Codex usage is not priced in USD by its SDK)";
        }
      } else if (ev.kind === "error") {
        appendMsg("claude", "error", "Server error: " + ev.message);
      }
      return;
    }

    if (ev.kind === "turn_start") {
      appendMsg(ev.agent, "thinking", "…thinking");
    } else if (ev.kind === "text") {
      activeBubble[ev.agent] = appendMsg(ev.agent, "text", ev.text);
    } else if (ev.kind === "tool") {
      appendMsg(ev.agent, "tool", "> " + ev.label);
    } else if (ev.kind === "error") {
      appendMsg(ev.agent, "error", ev.message);
    } else if (ev.kind === "turn_end") {
      // nothing extra; round_end (system) flips the button back on
    }
  }

  function connect() {
    const es = new EventSource("/events");
    es.onopen = () => { statusEl.textContent = "connected"; };
    es.onerror = () => { statusEl.textContent = "reconnecting…"; };
    es.onmessage = (msg) => {
      try { handleEvent(JSON.parse(msg.data)); } catch (err) { console.error(err); }
    };
  }
  connect();

  async function send() {
    const text = promptBox.value.trim();
    if (!text) return;
    promptBox.value = "";
    sendBtn.disabled = true;
    const res = await fetch("/prompt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      appendMsg("claude", "error", "Could not send: " + (body.error || res.status));
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", send);
  promptBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
</script>
</body>
</html>
