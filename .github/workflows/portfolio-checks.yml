name: Portfolio and software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public claims and evidence paths
        run: python scripts/check_portfolio_claims.py
      - name: Check dashboard JavaScript syntax
        run: node cloud/scripts/test_dashboard_link.mjs
      - name: Verify moisture-alert parity checks
        run: node DisplayCenter/scripts/verify_moisture_alert_thresholds.mjs
      - name: Check export and progress regressions
        run: python scripts/test_review_regressions.py
