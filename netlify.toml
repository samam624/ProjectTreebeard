# This site's Netlify project has no dashboard-level "Base directory" override (confirmed via
# `netlify api getSite` 2026-08-29: build_settings.base/dir/cmd are all null) -- Netlify finds
# config purely by looking for netlify.toml at the repo root. The real build config now lives at
# cloud/netlify.toml (project-treebeard reorg moved the whole cloud/ stack out of repo root), so
# this file's only job is to point Netlify there via `base`. Every path inside cloud/netlify.toml
# (and cloud/web/plant-dashboard/netlify.toml) resolves relative to this `base`, unchanged from
# before the reorg.
[build]
  base = "cloud"
