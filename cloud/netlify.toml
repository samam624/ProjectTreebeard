[build]
  publish = "web/plant-dashboard"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control lives only in the two path-specific blocks below, never here: Netlify
# concatenates header values from every block that matches a given path rather than
# letting the more specific one win, so a Cache-Control set on both this "/*" block and
# "/assets/*" would ship as "no-store, public, max-age=..." on every asset request -
# and per RFC 7234, no-store's presence anywhere in that list means caches must still
# treat it as no-store, silently defeating the long-cache/immutable intent below.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://lyemomfpzkawqecpfufm.supabase.co; base-uri 'none'; frame-ancestors 'none'; object-src 'none'"
    Permissions-Policy = "camera=(self), microphone=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app shell is never cached, so each deploy's versioned JS and service worker are fetched.
# fresh rather than trapped behind a stale cached copy of the page that references it.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/app-icon.svg"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"
